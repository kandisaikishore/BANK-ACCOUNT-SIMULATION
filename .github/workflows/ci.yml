name: Java CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Compile application and regression tests
        run: javac Account.java SavingsAccount.java Main.java AccountTest.java
      - name: Run regression tests
        run: java AccountTest
